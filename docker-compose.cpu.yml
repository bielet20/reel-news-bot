# docker-compose para equipos SIN GPU (CPU only).
# Uso:
#   docker compose -f docker-compose.cpu.yml up --build
#
# Primera vez en un equipo nuevo:
#   1. Copia tu .env (o crea uno a partir de .env.example)
#   2. Copia la carpeta _tokens/ si ya tienes cuentas vinculadas
#   3. docker compose -f docker-compose.cpu.yml up --build

services:

  # ── Backend FastAPI ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    ports:
      - "8000:8000"
    volumes:
      # Datos persistentes (los videos generados, tokens, biblioteca, etc.)
      - ./output:/app/output
      - ./_library:/app/_library
      - ./_music:/app/_music
      - ./_templates:/app/_templates
      - ./_uploads:/app/_uploads
      - ./_tokens:/app/_tokens
      - ./assets:/app/assets
    env_file:
      - .env
    restart: unless-stopped

  # ── Frontend Next.js ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      # node_modules construidos en Linux (no usar los del host Mac/Win)
      - frontend_modules:/app/node_modules
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_modules:
