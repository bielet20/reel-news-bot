services:

  # ── Backend FastAPI ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Código fuente montado para hot-reload sin rebuild
      - .:/app
      # Checkpoints de SadTalker (~1.5 GB, montar desde host)
      - ./vendor/sadtalker/checkpoints:/app/vendor/sadtalker/checkpoints
      # Datos persistentes
      - ./output:/app/output
      - ./_library:/app/_library
      - ./_music:/app/_music
      - ./_templates:/app/_templates
      - ./_uploads:/app/_uploads
      - ./_tokens:/app/_tokens
      - ./_config:/app/_config
      - ./assets:/app/assets
    env_file:
      - .env
    environment:
      # Apunta al venv CUDA construido en la imagen (fuera de /app)
      - SADTALKER_VENV=/opt/sadtalker_venv
    restart: unless-stopped
    # Acceso a la GPU NVIDIA (requiere NVIDIA Container Toolkit)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── WhatsApp sidecar (Node.js) ─────────────────────────────────────────────
  whatsapp:
    build:
      context: ./wa_service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - wa_auth:/app/.wwebjs_auth
    restart: unless-stopped

  # ── Frontend Next.js ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Ver web/Dockerfile: ruta a un CA extra opcional (antivirus/proxy
        # con inspeccion TLS). Vacio si no se define EXTRA_CA_CERT en .env.
        - EXTRA_CA_CERT=${EXTRA_CA_CERT:-}
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - frontend_modules:/app/node_modules
    environment:
      - BACKEND_URL=http://backend:8000
      - NODE_EXTRA_CA_CERTS=${EXTRA_CA_CERT:-}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_modules:
  wa_auth:
