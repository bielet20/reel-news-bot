# docker-compose.prod.yml
# Uso en cualquier equipo (sin GPU). Genera videos con CPU + ffmpeg.
#
# Primer uso en un equipo nuevo:
#   1. Copia tu .env en la raíz del proyecto (o crea uno a partir de .env.example)
#   2. Copia la carpeta _tokens/ si ya tienes cuentas de redes sociales vinculadas
#   3. docker compose -f docker-compose.prod.yml up --build
#
# Arrancar después:
#   docker compose -f docker-compose.prod.yml up
#
# Acceder: http://localhost:3000

services:

  # ── Backend FastAPI ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./output:/app/output
      - ./_music:/app/_music
      - ./_uploads:/app/_uploads
      - ./_library:/app/_library
      - ./_templates:/app/_templates
      - ./_tokens:/app/_tokens
      - ./assets:/app/assets
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/tts/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Frontend Next.js ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
