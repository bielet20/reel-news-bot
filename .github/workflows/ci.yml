name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:

jobs:
  # ── Sintaxis + lint del código Python del repo ─────────────────────────────
  # Rápido y ligero: pilla errores de sintaxis y la clase de bug de pyflakes
  # (nombres sin definir, imports que faltan) aunque el módulo no tenga tests.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: py_compile de los módulos del proyecto
        run: |
          python -m py_compile $(git ls-files '*.py' \
            | grep -vE '^(venv/|vendor/|web/)') \
            && echo "sintaxis OK"
      - name: ruff
        run: |
          pip install ruff
          ruff check .

  # ── Tests unitarios de la lógica pura ─────────────────────────────────────
  # Solo instala el núcleo ligero; los tests que necesitan moviepy/librosa
  # (test_lyric_video_builder.py) se marcan como skipped automáticamente.
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependencias de test (núcleo ligero)
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests python-dotenv
      - name: pytest
        run: pytest -q

  # ── Suite completa (moviepy, librosa, faster-whisper) ─────────────────────
  # Más lenta; se deja aparte para no bloquear si un wheel pesado falla al
  # instalarse. No es obligatoria para mergear.
  tests-full:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Instalar dependencias completas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: pytest (suite completa)
        run: pytest -q
